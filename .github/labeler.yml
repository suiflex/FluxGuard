          - "crates/fluxguard-adapters/tests/fixtures/cursor/**"

"adapter: claude-code":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/fluxguard-adapters/src/clients/claude_code/**"
          - "crates/fluxguard-adapters/tests/fixtures/claude_code/**"

"adapter: antigravity":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/fluxguard-adapters/src/clients/antigravity/**"
