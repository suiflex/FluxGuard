# Keep this map aligned with the scoped CI workflows.

"area: core":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/fluxguard-core/**"

"area: runtime":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/fluxguard-runtime/**"

"area: adapters":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/fluxguard-adapters/**"

# One label per adapter so a PR shows which sources it touches.
# Globs cover the adapter module and its parsing fixtures.

"adapter: codex":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/fluxguard-adapters/src/clients/codex/**"
          - "crates/fluxguard-adapters/tests/fixtures/codex/**"

"adapter: opencode":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/fluxguard-adapters/src/clients/opencode/**"
          - "crates/fluxguard-adapters/tests/fixtures/opencode/**"

"adapter: copilot":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/fluxguard-adapters/src/clients/copilot/**"
          - "crates/fluxguard-adapters/tests/fixtures/copilot/**"

"adapter: cursor":
