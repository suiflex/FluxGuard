"adapter: openai":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/fluxguard-adapters/src/providers/openai/**"
          - "crates/fluxguard-adapters/tests/fixtures/openai/**"

"adapter: anthropic":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/fluxguard-adapters/src/providers/anthropic/**"
          - "crates/fluxguard-adapters/tests/fixtures/anthropic/**"

"adapter: xai":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/fluxguard-adapters/src/providers/xai/**"
          - "crates/fluxguard-adapters/tests/fixtures/xai/**"

"adapter: zai":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/fluxguard-adapters/src/providers/zai/**"
          - "crates/fluxguard-adapters/tests/fixtures/zai/**"

"area: mcp":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/fluxguard-mcp/**"

"area: cli":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/fluxguard/**"

"area: npm":
  - changed-files:
      - any-glob-to-any-file:
          - "npm/**"

"area: plugins":
  - changed-files:
      - any-glob-to-any-file:
          - "plugins/**"

"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "release-please-config.json"
          - ".release-please-manifest.json"
          - "version.txt"

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"

"area: release":
  - changed-files:
      - any-glob-to-any-file:
          - "CHANGELOG.md"
          - "release-please-config.json"
          - ".release-please-manifest.json"
          - "version.txt"
