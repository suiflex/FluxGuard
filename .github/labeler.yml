# Keep this map aligned with the scoped CI workflows.

"area: core":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/fluxguard-core/**"

"area: runtime":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/fluxguard-runtime/**"

"area: adapters":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/fluxguard-adapters/**"

"area: mcp":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/fluxguard-mcp/**"

"area: cli":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/fluxguard/**"

"area: npm":
  - changed-files:
      - any-glob-to-any-file:
          - "npm/**"

"area: plugins":
  - changed-files:
      - any-glob-to-any-file:
          - "plugins/**"

"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "release-please-config.json"
          - ".release-please-manifest.json"
          - "version.txt"

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"

"area: release":
  - changed-files:
      - any-glob-to-any-file:
          - "CHANGELOG.md"
          - "release-please-config.json"
          - ".release-please-manifest.json"
          - "version.txt"
