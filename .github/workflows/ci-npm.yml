name: npm

on:
  push:
    branches: [main]
    paths:
      - "npm/**"
      - "Makefile"
      - ".github/workflows/ci-npm.yml"
  pull_request:
    paths:
      - "npm/**"
      - "Makefile"
      - ".github/workflows/ci-npm.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make npm-test
      - run: make npm-pack
