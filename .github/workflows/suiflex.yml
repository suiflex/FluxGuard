name: PR Triage

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  triage:
    if: github.repository_owner == 'suiflex'
    uses: suiflex/.github/.github/workflows/pr-triage.yml@main
    secrets:
      app_id: ${{ secrets.SUIFLEX_BOT_APP_ID }}
      private_key: ${{ secrets.SUIFLEX_BOT_PRIVATE_KEY }}

  label:
    if: github.repository_owner == 'suiflex'
    needs: triage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.SUIFLEX_BOT_APP_ID }}
          private-key: ${{ secrets.SUIFLEX_BOT_PRIVATE_KEY }}
      - uses: actions/labeler@8558be74a3edee84b42b6a71e72e12f6b8df81ae # v5.0.0
        with:
          repo-token: ${{ steps.app-token.outputs.token }}
          configuration-path: .github/labeler.yml
          sync-labels: false
