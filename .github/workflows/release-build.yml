name: release-build

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon
            target: aarch64-apple-darwin
            asset: fluxguard-macos-aarch64
            extension: ""
            archive: tar.gz
          - os: macos-14 # cross-compile Intel on Apple Silicon (no scarce macos-13)
            target: x86_64-apple-darwin
            asset: fluxguard-macos-x86_64
            extension: ""
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: fluxguard-linux-x86_64
            extension: ""
            archive: tar.gz
          - os: ubuntu-24.04-arm # native GitHub arm64 linux runner
            target: aarch64-unknown-linux-gnu
            asset: fluxguard-linux-aarch64
            extension: ""
            archive: tar.gz
            experimental: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: fluxguard-windows-x86_64
            extension: .exe
            archive: zip
          - os: windows-11-arm # native GitHub arm64 windows runner
            target: aarch64-pc-windows-msvc
            asset: fluxguard-windows-aarch64
            extension: .exe
            archive: zip
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: release-${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p fluxguard
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/fluxguard" "dist/${{ matrix.asset }}"
          tar -czf "${{ matrix.asset }}.tar.gz" -C "target/${{ matrix.target }}/release" fluxguard
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/fluxguard.exe" "dist/${{ matrix.asset }}.exe"
          Compress-Archive -Path "target/${{ matrix.target }}/release/fluxguard.exe" -DestinationPath "${{ matrix.asset }}.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.${{ matrix.archive }}
            dist/${{ matrix.asset }}${{ matrix.extension }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: cd artifacts && sha256sum fluxguard-*.* > SHA256SUMS
      - uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef299c7d8760 # v2.0.4
        with:
          files: artifacts/*
          generate_release_notes: true

  publish-crates:
    needs: publish
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: rust-lang/crates-io-auth-action@ec45511b025732152a558ea3e30f1d07c390558b # v1
        id: auth
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          for package in fluxguard-core fluxguard-runtime fluxguard-adapters fluxguard-mcp fluxguard; do
            cargo publish --locked -p "$package"
          done

  publish-homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render formula and push to tap
        env:
          GH_TOKEN: ${{ secrets.TAP_PUBLISH_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          base="https://github.com/${REPO}/releases/download/${TAG}"

          dl() { gh release download "$TAG" -R "$REPO" -p "$1" -O "$1" --clobber; }
          sha() { shasum -a 256 "$1" | cut -d' ' -f1; }

          for a in fluxguard-macos-aarch64 fluxguard-macos-x86_64 fluxguard-linux-x86_64; do
            dl "$a.tar.gz"
          done
          macos_arm64_sha="$(sha fluxguard-macos-aarch64.tar.gz)"
          macos_x86_64_sha="$(sha fluxguard-macos-x86_64.tar.gz)"
          linux_x86_64_sha="$(sha fluxguard-linux-x86_64.tar.gz)"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/suiflex/homebrew-tap.git" tap
          mkdir -p tap/Formula
          sed -e "s|@VERSION@|${VERSION}|g" \
              -e "s|@BASE@|${base}|g" \
              -e "s|@MACOS_ARM64_SHA@|${macos_arm64_sha}|g" \
              -e "s|@MACOS_X86_64_SHA@|${macos_x86_64_sha}|g" \
              -e "s|@LINUX_X86_64_SHA@|${linux_x86_64_sha}|g" \
              packaging/fluxguard.rb.tmpl > tap/Formula/fluxguard.rb

          f=tap/Formula/fluxguard.rb
          ruby -c "$f" > /dev/null || { echo "::error::${f} is not valid Ruby"; exit 1; }
          if leftover="$(grep -n '@[A-Z0-9_]*@' "$f")"; then
            echo "::error::${f} has unsubstituted placeholders:"; echo "$leftover"; exit 1
          fi
          if bad="$(grep -n 'sha256' "$f" | grep -vE '"[0-9a-f]{64}"')"; then
            echo "::error::${f} has a sha256 that is not a 64-hex digest:"; echo "$bad"; exit 1
          fi

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/fluxguard.rb
          git commit -m "fluxguard ${VERSION}" || { echo "no change"; exit 0; }
          git push

  publish-scoop:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render manifest and push to bucket
        env:
          GH_TOKEN: ${{ secrets.TAP_PUBLISH_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          dl() { gh release download "$TAG" -R "$REPO" -p "$1" -O "$1" --clobber; }

          dl "fluxguard-windows-x86_64.zip"
          dl "fluxguard-windows-aarch64.zip" || true

          git clone "https://x-access-token:${GH_TOKEN}@github.com/suiflex/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          python3 packaging/render_scoop.py > bucket/bucket/fluxguard.json

          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/fluxguard.json
          git commit -m "fluxguard ${TAG#v}" || { echo "no change"; exit 0; }
          git push

  publish-npm:
    needs: publish
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11.5.2
      - run: npm publish --access public
        working-directory: npm
