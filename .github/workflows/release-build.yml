name: release-build

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: fluxguard-linux-x86_64
            extension: ""
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: fluxguard-macos-x86_64
            extension: ""
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: fluxguard-macos-aarch64
            extension: ""
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: fluxguard-windows-x86_64
            extension: .exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }} -p fluxguard
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/fluxguard" "dist/${{ matrix.asset }}"
          tar -czf "${{ matrix.asset }}.tar.gz" -C dist "${{ matrix.asset }}"
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/fluxguard.exe" "dist/${{ matrix.asset }}.exe"
          Compress-Archive -Path "dist/${{ matrix.asset }}.exe" -DestinationPath "${{ matrix.asset }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.${{ matrix.archive }}
            dist/${{ matrix.asset }}${{ matrix.extension }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: cd artifacts && sha256sum fluxguard-*.* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  publish-crates:
    needs: publish
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          for package in fluxguard-core fluxguard-runtime fluxguard-adapters fluxguard-mcp fluxguard; do
            cargo publish --locked -p "$package"
          done

  publish-npm:
    needs: publish
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11.5.2
      - run: npm publish --access public
        working-directory: npm
