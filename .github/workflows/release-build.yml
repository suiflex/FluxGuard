name: release-build

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: fluxguard-linux-x86_64
            extension: ""
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: fluxguard-macos-x86_64
            extension: ""
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: fluxguard-macos-aarch64
            extension: ""
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: fluxguard-windows-x86_64
            extension: .exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }} -p fluxguard
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/fluxguard" "dist/${{ matrix.asset }}"
          tar -czf "${{ matrix.asset }}.tar.gz" -C "target/${{ matrix.target }}/release" fluxguard
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/fluxguard.exe" "dist/${{ matrix.asset }}.exe"
          Compress-Archive -Path "target/${{ matrix.target }}/release/fluxguard.exe" -DestinationPath "${{ matrix.asset }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.${{ matrix.archive }}
            dist/${{ matrix.asset }}${{ matrix.extension }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: cd artifacts && sha256sum fluxguard-*.* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  publish-crates:
    needs: publish
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          for package in fluxguard-core fluxguard-runtime fluxguard-adapters fluxguard-mcp fluxguard; do
            cargo publish --locked -p "$package"
          done

  publish-homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render formula and push to tap
        env:
          GH_TOKEN: ${{ secrets.TAP_PUBLISH_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          base="https://github.com/${REPO}/releases/download/${TAG}"

          dl() { gh release download "$TAG" -R "$REPO" -p "$1" -O "$1" --clobber; }
          sha() { shasum -a 256 "$1" | cut -d' ' -f1; }

          for a in fluxguard-macos-aarch64 fluxguard-macos-x86_64 fluxguard-linux-x86_64; do
            dl "$a.tar.gz"
          done
          macos_arm64_sha="$(sha fluxguard-macos-aarch64.tar.gz)"
          macos_x86_64_sha="$(sha fluxguard-macos-x86_64.tar.gz)"
          linux_x86_64_sha="$(sha fluxguard-linux-x86_64.tar.gz)"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/suiflex/homebrew-tap.git" tap
          mkdir -p tap/Formula
          sed -e "s|@VERSION@|${VERSION}|g" \
              -e "s|@BASE@|${base}|g" \
              -e "s|@MACOS_ARM64_SHA@|${macos_arm64_sha}|g" \
              -e "s|@MACOS_X86_64_SHA@|${macos_x86_64_sha}|g" \
              -e "s|@LINUX_X86_64_SHA@|${linux_x86_64_sha}|g" \
              packaging/fluxguard.rb.tmpl > tap/Formula/fluxguard.rb

          f=tap/Formula/fluxguard.rb
          ruby -c "$f" > /dev/null || { echo "::error::${f} is not valid Ruby"; exit 1; }
          if leftover="$(grep -n '@[A-Z0-9_]*@' "$f")"; then
            echo "::error::${f} has unsubstituted placeholders:"; echo "$leftover"; exit 1
          fi
          if bad="$(grep -n 'sha256' "$f" | grep -vE '"[0-9a-f]{64}"')"; then
            echo "::error::${f} has a sha256 that is not a 64-hex digest:"; echo "$bad"; exit 1
          fi

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/fluxguard.rb
          git commit -m "fluxguard ${VERSION}" || { echo "no change"; exit 0; }
          git push

  publish-scoop:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render manifest and push to bucket
        env:
          GH_TOKEN: ${{ secrets.TAP_PUBLISH_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          dl() { gh release download "$TAG" -R "$REPO" -p "$1" -O "$1" --clobber; }

          dl "fluxguard-windows-x86_64.zip"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/suiflex/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          python3 packaging/render_scoop.py > bucket/bucket/fluxguard.json

          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/fluxguard.json
          git commit -m "fluxguard ${TAG#v}" || { echo "no change"; exit 0; }
          git push

  publish-npm:
    needs: publish
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11.5.2
      - run: npm publish --access public
        working-directory: npm
