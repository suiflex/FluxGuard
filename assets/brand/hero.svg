<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%" fill="none" role="img" aria-label="FluxGuard — Resource awareness layer for AI coding agents">
  <defs>
    <!-- Glowing Filters -->
    <filter id="green-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c0a"/>
      <stop offset="50%" stop-color="#0a1310"/>
      <stop offset="100%" stop-color="#060b09"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1716" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#090f0e" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3bf686"/>
      <stop offset="100%" stop-color="#14a350"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3bf686" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3bf686" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Geist Sans', Inter, Roboto, Helvetica, Arial, sans-serif;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="900" height="380" rx="16" fill="url(#canvasBg)"/>
  <rect width="900" height="380" rx="16" stroke="#14261e" stroke-width="1.5"/>

  <!-- Subtle Radial Backdrop Glow -->
  <circle cx="344" cy="215" r="220" fill="url(#centerGlow)"/>

  <!-- Top Badge Row -->
  <g transform="translate(211, 22)">
    <!-- Badge 1: MCP Native -->
    <g transform="translate(0, 0)">
      <rect width="132" height="38" rx="8" fill="#0d1815" stroke="#1b382b" stroke-width="1.2"/>
      <!-- Chip / Radar icon -->
      <rect x="15" y="14" width="10" height="10" rx="2" fill="none" stroke="#3bf686" stroke-width="1.8"/>
      <circle cx="20" cy="19" r="2" fill="#3bf686"/>
      <line x1="20" y1="10" x2="20" y2="14" stroke="#3bf686" stroke-width="1.5"/>
      <line x1="20" y1="24" x2="20" y2="28" stroke="#3bf686" stroke-width="1.5"/>
      <line x1="11" y1="19" x2="15" y2="19" stroke="#3bf686" stroke-width="1.5"/>
      <line x1="25" y1="19" x2="29" y2="19" stroke="#3bf686" stroke-width="1.5"/>
      <text x="34" y="24" font-size="11" font-weight="700" fill="#a3eec0" letter-spacing="0.8">MCP NATIVE</text>
    </g>

    <!-- Badge 2: Pressure Engine -->
    <g transform="translate(142, 0)">
      <rect width="168" height="38" rx="8" fill="#0d1815" stroke="#1b382b" stroke-width="1.2"/>
      <!-- Gauge icon -->
      <circle cx="21" cy="19" r="7.5" fill="none" stroke="#3bf686" stroke-width="1.8"/>
      <path d="M21 19 L25 15" stroke="#3bf686" stroke-width="1.8" stroke-linecap="round"/>
      <text x="36" y="24" font-size="11" font-weight="700" fill="#a3eec0" letter-spacing="0.8">PRESSURE ENGINE</text>
    </g>

    <!-- Badge 3: Policy Enforcement -->
    <g transform="translate(320, 0)">
      <rect width="158" height="38" rx="8" fill="#0d1815" stroke="#1b382b" stroke-width="1.2"/>
      <!-- Lock icon -->
      <rect x="15" y="16" width="12" height="9" rx="2" fill="none" stroke="#3bf686" stroke-width="1.8"/>
      <path d="M18 16 V13 C18 11.3 19.3 10 21 10 C22.7 10 24 11.3 24 13 V16" fill="none" stroke="#3bf686" stroke-width="1.8"/>
      <text x="35" y="24" font-size="11" font-weight="700" fill="#a3eec0" letter-spacing="0.8">POLICY ROUTED</text>
    </g>
  </g>

  <!-- ==================== CARD 1: CLIENT TELEMETRY ==================== -->
  <g transform="translate(36, 80)">
    <rect width="195" height="270" rx="12" fill="url(#cardBg)" stroke="#162922" stroke-width="1.2"/>
    <text x="16" y="28" font-size="10" font-weight="700" fill="#718d82" letter-spacing="0.6">CLIENT TELEMETRY</text>
    <circle cx="178" cy="24" r="3.5" fill="#3bf686"/>
    <line x1="16" y1="40" x2="179" y2="40" stroke="#162922" stroke-width="1"/>

    <!-- Mock payload lines -->
    <g transform="translate(16, 60)" class="mono" font-size="9">
      <text fill="#527969">
        <tspan x="0" y="0">client:</tspan> <tspan fill="#9bd8b5">Cursor</tspan>
        <tspan x="0" y="18">agent:</tspan> <tspan fill="#9bd8b5">ClaudeCode</tspan>
        <tspan x="0" y="36">tool:</tspan> <tspan fill="#3bf686">exec_cmd</tspan>
      </text>

      <line x1="0" y1="52" x2="163" y2="52" stroke="#162922" stroke-width="1"/>

      <text fill="#527969">
        <tspan x="0" y="70" fill="#ef4444">- burst_load</tspan>
        <tspan x="0" y="88" fill="#3bf686">+ safe_quota</tspan>
        <tspan x="0" y="106" fill="#3bf686">+ ctx_tagged</tspan>
      </text>

      <rect x="0" y="126" width="120" height="4" rx="2" fill="#1b3329"/>
      <rect x="0" y="138" width="85" height="4" rx="2" fill="#1b3329"/>
      <rect x="0" y="150" width="145" height="4" rx="2" fill="#1b3329"/>
    </g>
  </g>

  <!-- ==================== CARD 2: DYNAMIC FLOW & CORE ==================== -->
  <g transform="translate(247, 80)">
    <rect width="195" height="270" rx="12" fill="url(#cardBg)" stroke="#162922" stroke-width="1.2"/>
    <text x="16" y="28" font-size="10" font-weight="700" fill="#718d82" letter-spacing="0.6">AWARENESS CORE</text>
    <circle cx="178" cy="24" r="3.5" fill="#3bf686" filter="url(#green-glow)"/>
    <line x1="16" y1="40" x2="179" y2="40" stroke="#162922" stroke-width="1"/>

    <!-- Glowing Logo in Core -->
    <g transform="translate(61, 62)">
      <!-- Outer Glow Shield -->
      <path d="M36 6 L64 14 V38 C64 56 48 70 36 76 C24 70 8 56 8 38 V14 Z" fill="#0d281e" stroke="#3bf686" stroke-width="2.6" filter="url(#green-glow)"/>
      <!-- S-curve line inside shield -->
      <path d="M26 26 Q46 36 28 50 T44 64" fill="none" stroke="#3bf686" stroke-width="4.5" stroke-linecap="round"/>
    </g>

    <text x="97.5" y="172" font-size="10" font-weight="700" fill="#88a096" text-anchor="middle" letter-spacing="0.8">DYNAMIC FLOW</text>
    <rect x="42.5" y="186" width="110" height="6" rx="3" fill="#18362a"/>
    <rect x="42.5" y="186" width="76" height="6" rx="3" fill="#3bf686"/>

    <text x="97.5" y="218" font-size="9" font-weight="600" fill="#527969" text-anchor="middle">ACTIVE QUOTA GUARD</text>
    <text x="97.5" y="234" font-size="8.5" font-weight="500" fill="#3d5a4e" text-anchor="middle">0.2.0 • STABLE</text>
  </g>

  <!-- ==================== CARD 3: PROCESSING PIPELINE ==================== -->
  <g transform="translate(458, 80)">
    <rect width="195" height="270" rx="12" fill="url(#cardBg)" stroke="#162922" stroke-width="1.2"/>
    <text x="16" y="28" font-size="10" font-weight="700" fill="#718d82" letter-spacing="0.6">PIPELINE ENGINE</text>
    <circle cx="178" cy="24" r="3.5" fill="#3bf686"/>
    <line x1="16" y1="40" x2="179" y2="40" stroke="#162922" stroke-width="1"/>

    <!-- Item 1: PRESSURE ENGINE -->
    <g transform="translate(16, 52)">
      <text x="62" y="14" font-size="9" font-weight="700" fill="#718d82" text-anchor="middle" letter-spacing="0.6">PRESSURE ENGINE</text>
      <!-- Icon Gauge/Wave -->
      <g transform="translate(18, 22)">
        <path d="M0 14 Q8 4 16 14 T32 14" fill="none" stroke="#3bf686" stroke-width="2.2" stroke-linecap="round"/>
      </g>
      <!-- Checkmark badge -->
      <circle cx="140" cy="30" r="9" fill="#0d241b" stroke="#3bf686" stroke-width="1.5"/>
      <path d="M136 30 L139 33 L144 27" fill="none" stroke="#3bf686" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Dotted Divider -->
    <line x1="97" y1="108" x2="97" y2="124" stroke="#1c382c" stroke-width="1.4" stroke-dasharray="2 3"/>

    <!-- Item 2: SOURCE REGISTRY -->
    <g transform="translate(16, 126)">
      <text x="62" y="14" font-size="9" font-weight="700" fill="#718d82" text-anchor="middle" letter-spacing="0.6">SOURCE REGISTRY</text>
      <!-- Registry / Node icon -->
      <g transform="translate(20, 22)">
        <rect x="0" y="0" width="7" height="7" rx="1.5" fill="none" stroke="#3bf686" stroke-width="1.5"/>
        <rect x="18" y="0" width="7" height="7" rx="1.5" fill="none" stroke="#3bf686" stroke-width="1.5"/>
        <rect x="9" y="13" width="7" height="7" rx="1.5" fill="none" stroke="#3bf686" stroke-width="1.5"/>
        <line x1="7" y1="3.5" x2="18" y2="3.5" stroke="#3bf686" stroke-width="1.2"/>
        <line x1="12.5" y1="7" x2="12.5" y2="13" stroke="#3bf686" stroke-width="1.2"/>
      </g>
      <!-- Checkmark badge -->
      <circle cx="140" cy="30" r="9" fill="#0d241b" stroke="#3bf686" stroke-width="1.5"/>
      <path d="M136 30 L139 33 L144 27" fill="none" stroke="#3bf686" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Dotted Divider -->
    <line x1="97" y1="182" x2="97" y2="198" stroke="#1c382c" stroke-width="1.4" stroke-dasharray="2 3"/>

    <!-- Item 3: POLICY ENGINE -->
    <g transform="translate(16, 200)">
      <text x="62" y="14" font-size="9" font-weight="700" fill="#718d82" text-anchor="middle" letter-spacing="0.6">POLICY ENGINE</text>
      <!-- Policy / Rule icon -->
      <g transform="translate(20, 20)">
        <path d="M6 3 L0 9 L6 15" fill="none" stroke="#3bf686" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M18 3 L24 9 L18 15" fill="none" stroke="#3bf686" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="14" y1="2" x2="10" y2="16" stroke="#3bf686" stroke-width="1.6"/>
      </g>
      <!-- Checkmark badge -->
      <circle cx="140" cy="28" r="9" fill="#0d241b" stroke="#3bf686" stroke-width="1.5"/>
      <path d="M136 28 L139 31 L144 25" fill="none" stroke="#3bf686" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ==================== CARD 4: ECOSYSTEM & VERIFICATION ==================== -->
  <g transform="translate(669, 80)">
    <rect width="195" height="270" rx="12" fill="url(#cardBg)" stroke="#162922" stroke-width="1.2"/>
    <text x="16" y="28" font-size="10" font-weight="700" fill="#718d82" letter-spacing="0.6">VERIFIED ECOSYSTEM</text>
    <circle cx="178" cy="24" r="3.5" fill="#3bf686"/>
    <line x1="16" y1="40" x2="179" y2="40" stroke="#162922" stroke-width="1"/>

    <!-- Verified Badge with Glow -->
    <g transform="translate(63, 50)">
      <path d="M34 6 L58 14 V36 C58 50 44 62 34 68 C24 62 10 50 10 36 V14 Z" fill="#0c231a" stroke="#3bf686" stroke-width="2.4" filter="url(#green-glow)"/>
      <path d="M24 36 L30 42 L44 26" fill="none" stroke="#3bf686" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Target Providers -->
    <g transform="translate(20, 136)">
      <text x="77" y="0" font-size="8.5" font-weight="700" fill="#587e6f" text-anchor="middle" letter-spacing="0.5">TARGET PROVIDERS</text>
      
      <!-- Provider pills -->
      <rect x="0" y="12" width="72" height="20" rx="4" fill="#0f221a" stroke="#1d4030" stroke-width="1"/>
      <text x="36" y="25" font-size="8.5" font-weight="600" fill="#9bebb8" text-anchor="middle">OpenAI</text>

      <rect x="82" y="12" width="72" height="20" rx="4" fill="#0f221a" stroke="#1d4030" stroke-width="1"/>
      <text x="118" y="25" font-size="8.5" font-weight="600" fill="#9bebb8" text-anchor="middle">Claude</text>

      <rect x="0" y="38" width="72" height="20" rx="4" fill="#0f221a" stroke="#1d4030" stroke-width="1"/>
      <text x="36" y="51" font-size="8.5" font-weight="600" fill="#9bebb8" text-anchor="middle">xAI</text>

      <rect x="82" y="38" width="72" height="20" rx="4" fill="#0f221a" stroke="#1d4030" stroke-width="1"/>
      <text x="118" y="51" font-size="8.5" font-weight="600" fill="#9bebb8" text-anchor="middle">GLM / Z.AI</text>
    </g>

    <!-- Stamp icon bottom right -->
    <g transform="translate(142, 218)">
      <circle cx="16" cy="16" r="14" fill="none" stroke="#3bf686" stroke-width="1.6"/>
      <path d="M10 16 L14 20 L22 12" fill="none" stroke="#3bf686" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M9 28 L16 23 L23 28" fill="none" stroke="#3bf686" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </g>
</svg>
